[project]
name = "gpudb"
version = "7.2.3.14"
dependencies = [
    'future',
    'pyzmq' ,
    'sqlparse~=0.6.0',
    'urllib3>=2.0.0',
    'requests',
]
authors = [
    {name = "Kinetica DB, Inc.", email = "support@kinetica.com"}
]
maintainers = [
    {name = "Kyle Sutton", email = "ksutton@kinetica.com"},
    {name = "Anindya Mukherjee", email = "amukherjee@kinetica.com"}
]
description = "Python client for Kinetica DB"
readme = "README.md"
license = { text = "MIT License" }
requires-python = ">=3.10"
classifiers = [
     "Programming Language :: Python :: 3",
     "Topic :: Database",
]
keywords = [ "kinetica", "gpudb" ]


# add support for `pip install gpudb[dataframe]`
[project.optional-dependencies]
dataframe = [
    "pandas",
    "tqdm",
    "typeguard",
]

# `pip install .[test]` provides everything test/run_tests.sh needs to run the
# pytest suite.  It pulls in the dataframe extra because test_pt_dataframe_*
# exercises it.
test = [
    "pytest",
    "gpudb[dataframe]",
]


[project.urls]
Homepage = "https://www.kinetica.com"
Documentation = "https://docs.kinetica.com/7.2/api/python/"
Repository = "https://github.com/kineticadb/kinetica-api-python.git"
Issues = "https://github.com/kineticadb/kinetica-api-python/issues"
Changelog = "https://github.com/kineticadb/kinetica-api-python/blob/master/CHANGELOG.md"


[tool.setuptools.packages.find]
# All the following settings are optional:
where = ["."]  # ["."] by default
include = ["gpudb*"]  # ["*"] by default
#exclude = ["*"]  # empty by default
namespaces = false  # true by default


[tool.setuptools.package-data]
"gpudb.packages.avro.avro_py3" = ["*.txt", "*.avsc"]


[build-system]
requires = ["setuptools>=61"] # minimum version of setuptools for toml support
build-backend = "setuptools.build_meta"


[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q"
testpaths = [
    "test/pytests",
]
log_cli = true
log_cli_level = "INFO"
log_cli_format = "[%(levelname)s] %(name)s (%(filename)s:%(lineno)s) %(message)s"
log_cli_date_format = "%Y-%m-%d %H:%M:%S"
filterwarnings = [
    "ignore:the imp module is deprecated:DeprecationWarning",
    "ignore::pytest.PytestAssertRewriteWarning",
]
